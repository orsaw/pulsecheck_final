<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>PulseCheck Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f9; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); max-width: 600px; }
        .status-up { color: white; background: #28a745; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .status-down { color: white; background: #dc3545; padding: 5px 10px; border-radius: 4px; font-weight: bold; }
        .row { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>
    <div class="card">
        <h2>PulseCheck Statuses</h2>
        <div id="targets-container">
            <p>Загрузка данных...</p>
        </div>
    </div>

    <script>
        const API_URL = 'http://localhost:8003/api/status/demo-target-1'; // Пока бьем напрямую в свой сервис

        async function fetchStatus() {
            try {
                const response = await fetch(API_URL);
                if (!response.ok) throw new Error('Network response was not ok');
                const data = await response.json();
                
                const container = document.getElementById('targets-container');
                const isUp = data.status === 'UP';
                
                container.innerHTML = `
                    <div class="row">
                        <div><strong>${data.target_id}</strong></div>
                        <div>
                            <span class="${isUp ? 'status-up' : 'status-down'}">${data.status}</span>
                        </div>
                    </div>
                    <div style="margin-top: 10px; font-size: 0.9em; color: #666;">
                        Последняя проверка: ${new Date(data.last_check).toLocaleTimeString()}
                    </div>
                `;
            } catch (error) {
                document.getElementById('targets-container').innerHTML = '<p style="color:red">Ошибка подключения к API</p>';
            }
        }

        // 2C.5 Автообновление раз в 5 секунд
        fetchStatus();
        setInterval(fetchStatus, 5000);
    </script>
</body>
</html>
