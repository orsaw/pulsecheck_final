# Rate limit for login: 5 requests per minute per IP address
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

# Port 80 (HTTP): send everyone to HTTPS
server {
    listen 80;
    server_name _;
    return 301 https://$host$request_uri;
}

# Port 443 (HTTPS): the real gateway
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # Docker DNS: find services by name, even if a service starts later
    resolver 127.0.0.11 valid=10s;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"gateway"}';
    }

    # --- Internal: ask Auth if the token is valid ---
    location = /_verify {
        internal;
        set $auth_upstream http://auth:8000;
        proxy_pass $auth_upstream/verify;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Authorization $http_authorization;
    }

    # --- Auth (public, no token needed) ---
    location = /api/auth/login {
        limit_req zone=login_limit burst=2 nodelay;
        limit_req_status 429;
        set $auth_upstream http://auth:8000;
        proxy_pass $auth_upstream/login;
    }

    location /api/auth/ {
        set $auth_upstream http://auth:8000;
        rewrite ^/api/auth/(.*)$ /$1 break;
        proxy_pass $auth_upstream;
    }

    # --- Monitor (Lesha), token required ---
    location /api/monitor/ {
        auth_request /_verify;
        auth_request_set $user_id  $upstream_http_x_user_id;
        auth_request_set $username $upstream_http_x_username;
        proxy_set_header X-User-Id  $user_id;
        proxy_set_header X-Username $username;
        set $monitor_upstream http://monitor:8000;
        proxy_pass $monitor_upstream;
    }

    # --- Status (Katya), token required ---
    location /api/status/ {
        auth_request /_verify;
        auth_request_set $user_id  $upstream_http_x_user_id;
        auth_request_set $username $upstream_http_x_username;
        proxy_set_header X-User-Id  $user_id;
        proxy_set_header X-Username $username;
        set $status_upstream http://status:8003;
        proxy_pass $status_upstream;
    }

    # --- Dashboard (static files) ---
    location / {
        root  /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
